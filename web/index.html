<!doctype html>
<meta charset="utf-8">
<title>gemma-live</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Design tokens lifted verbatim from llama.cpp's web UI (tools/ui/src/app.css)
   so this sits in the same visual family: shadcn neutral in oklch, one radius. */
:root {
  --radius: 0.625rem;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.95 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.95 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.875 0 0);
  --input: oklch(0.92 0 0);
  --ring: oklch(0.708 0 0);
  --listen: oklch(0.488 0.243 264.376);   /* llama --chart-1 */
  --speak:  oklch(0.769 0.188 70.08);     /* llama --chart-3 */
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Monaco, 'Cascadia Code', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.16 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.29 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 14%);
    --input: oklch(1 0 0 / 18%);
    --ring: oklch(0.556 0 0);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font: 15px/1.6 ui-sans-serif, -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* ── header ───────────────────────────────────────────────────────── */
header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-bottom: 1px solid var(--border); flex: none;
}
header b { font-weight: 600; font-size: 14px; }
header .meta { color: var(--muted-foreground); font-size: 12px; margin-left: auto;
               font-variant-numeric: tabular-nums; }
#dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-foreground); }
#dot.on { background: oklch(0.696 0.17 162.48); }

/* ── conversation ─────────────────────────────────────────────────── */
main { flex: 1; overflow-y: auto; }
#thread { max-width: 46rem; margin: 0 auto; padding: 28px 16px 8px;
          display: flex; flex-direction: column; gap: 22px; }
.msg.user  { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.msg.user .body {
  background: var(--secondary); color: var(--secondary-foreground);
  padding: 9px 14px; border-radius: var(--radius); max-width: 80%;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.bot .body { width: 100%; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.tag { font-size: 11px; color: var(--muted-foreground); display: flex; align-items: center; gap: 5px; }
.msg.bot .info { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.cursor::after { content: '▍'; opacity: .6; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

#empty { color: var(--muted-foreground); text-align: center; padding: 12vh 0; }
#empty h2 { color: var(--foreground); font-size: 20px; font-weight: 600; margin: 0 0 6px; }

/* ── composer ─────────────────────────────────────────────────────── */
footer { flex: none; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
#composer {
  max-width: 46rem; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--input); border-radius: 1.6rem; padding: 7px 7px 7px 16px;
  background: var(--card); transition: border-color .15s;
}
#composer:focus-within { border-color: var(--ring); }
#box {
  flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit;
  font: inherit; padding: 7px 0; max-height: 40vh; line-height: 1.5;
}
#box::placeholder { color: var(--muted-foreground); }
.icon {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center; transition: opacity .15s, background .15s;
}
.icon:hover { background: var(--accent); }
.icon.filled { background: var(--primary); color: var(--primary-foreground); }
.icon.filled:hover { opacity: .85; background: var(--primary); }
.icon:disabled { opacity: .35; cursor: default; background: none; }
.hint { max-width: 46rem; margin: 8px auto 0; text-align: center;
        font-size: 11px; color: var(--muted-foreground); }

/* ── voice overlay ────────────────────────────────────────────────── */
#voice {
  position: fixed; inset: 0; z-index: 50; background: var(--background);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; opacity: 0; pointer-events: none; transition: opacity .22s ease;
}
#voice.open { opacity: 1; pointer-events: auto; }
#orb { width: min(66vw, 300px); aspect-ratio: 1; }
#vstate { color: var(--muted-foreground); font-size: 13px; min-height: 20px; }
#vsaid {
  max-width: min(90vw, 34rem); text-align: center; min-height: 3.4em;
  color: var(--foreground); font-size: 17px; line-height: 1.5; padding: 0 8px;
}
#vbar { display: flex; gap: 14px; margin-top: 4px; }
.round {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: var(--secondary); color: var(--secondary-foreground);
  border: 1px solid var(--border); transition: background .15s, opacity .15s;
}
.round:hover { opacity: .8; }
.round.off { background: var(--destructive); color: oklch(0.985 0 0); border-color: transparent; }
.round.end { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
</style>

<header>
  <span id="dot"></span><b>gemma-live</b>
  <span class="meta" id="meta"></span>
</header>

<main>
  <div id="thread">
    <div id="empty">
      <h2>Gemma is listening</h2>
      Type a message, or press the wave to talk.
    </div>
  </div>
</main>

<footer>
  <form id="composer">
    <textarea id="box" rows="1" placeholder="Message Gemma…" autocomplete="off"></textarea>
    <button type="button" class="icon" id="mic" title="Voice mode" aria-label="Voice mode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M3 12h1M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/>
      </svg>
    </button>
    <button type="submit" class="icon filled" id="send" title="Send" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </form>
  <div class="hint">Text and voice share one conversation.</div>
</footer>

<div id="voice">
  <canvas id="orb"></canvas>
  <div id="vstate">connecting…</div>
  <div id="vsaid"></div>
  <div id="vbar">
    <button class="round" id="mute" title="Mute" aria-label="Mute">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
    </button>
    <button class="round end" id="hang" title="End voice mode" aria-label="End voice mode">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const RATE = 24000, CHUNK = 2400;
// Barge-in threshold on the already-echo-cancelled mic: getUserMedia's AEC
// removes Gemma's own voice, so whatever is left above the floor while she
// speaks is the user talking over her.
const BARGE_RMS = 0.02, BARGE_HOLD = 3;

let ws, ctx, mic, inAn, outAn, outGain;
let playCursor = 0, sources = [], loudRun = 0;
let speaking = false, voiceOn = false, muted = false, busy = false;
let liveBot = null, vLive = '';

// ── thread ────────────────────────────────────────────────────────────
function addMsg(who, text, tagHtml) {
  const e = $('#empty'); if (e) e.remove();
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  if (tagHtml) {
    const t = document.createElement('div');
    t.className = 'tag'; t.innerHTML = tagHtml;
    m.appendChild(t);
  }
  const b = document.createElement('div');
  b.className = 'body'; b.textContent = text;
  m.appendChild(b);
  $('#thread').appendChild(m);
  scroll();
  return m;
}
const scroll = () => { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; };
const VOICE_TAG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12h1M7 8v8M11 5v14M15 8v8M19 11v2"/></svg> voice';

// ── text chat ─────────────────────────────────────────────────────────
async function sendText(text) {
  if (busy) return;
  busy = true; sync();
  addMsg('user', text);
  const bot = addMsg('bot', '');
  const body = bot.querySelector('.body');
  body.classList.add('cursor');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const m = JSON.parse(line.slice(6));
        if (m.delta) { body.textContent += m.delta; scroll(); }
        if (m.error) { body.textContent += '\n[' + m.error + ']'; }
        if (m.done) {
          const info = document.createElement('div');
          info.className = 'info';
          info.textContent = `${m.tokens} tokens · ${m.ms} ms`;
          bot.appendChild(info);
        }
      }
    }
  } catch (err) {
    body.textContent += (body.textContent ? '\n' : '') + '[' + err.message + ']';
  } finally {
    body.classList.remove('cursor');
    busy = false; sync(); scroll();
  }
}

// ── composer ──────────────────────────────────────────────────────────
const box = $('#box');
function sync() {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.4) + 'px';
  $('#send').disabled = busy || !box.value.trim();
}
box.addEventListener('input', sync);
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); }
});
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  const t = box.value.trim();
  if (!t || busy) return;
  box.value = ''; sync();
  sendText(t);
});

// ── voice: audio helpers ──────────────────────────────────────────────
function toB64(f32) {
  const pcm = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const b = new Uint8Array(pcm.buffer);
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(b64) {
  const bin = atob(b64), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(b.buffer), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  return f;
}
function stopAudio() {
  for (const s of sources) { try { s.stop(); } catch (_) {} }
  sources = []; playCursor = 0; speaking = false;
}
function enqueue(f32) {
  const buf = ctx.createBuffer(1, f32.length, RATE);
  buf.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(outGain);
  const now = ctx.currentTime;
  if (playCursor < now) playCursor = now + 0.06;   // small lead on the first chunk
  src.start(playCursor); playCursor += buf.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); if (!sources.length) speaking = false; };
  speaking = true;
}

// ── voice: session ────────────────────────────────────────────────────
async function openVoice() {
  $('#voice').classList.add('open');
  $('#vstate').textContent = 'requesting microphone…';
  $('#vsaid').textContent = '';

  try {
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
  } catch (err) {
    $('#vstate').textContent = 'microphone denied — ' + err.message;
    return;
  }

  ctx = new AudioContext({ sampleRate: RATE });
  await ctx.resume();
  outGain = ctx.createGain();
  outAn = ctx.createAnalyser(); outAn.fftSize = 512;
  inAn  = ctx.createAnalyser(); inAn.fftSize  = 512;
  outGain.connect(outAn).connect(ctx.destination);
  const srcNode = ctx.createMediaStreamSource(mic);
  srcNode.connect(inAn);

  // Batched in the worklet: at 128 frames a callback this would otherwise be
  // ~190 postMessages a second for no benefit.
  const code = `class Cap extends AudioWorkletProcessor {
    constructor(){ super(); this.b = new Float32Array(${CHUNK}); this.n = 0; }
    process(i){ const c = i[0][0]; if(!c) return true;
      for (let k=0;k<c.length;k++){ this.b[this.n++]=c[k];
        if(this.n===${CHUNK}){ this.port.postMessage(this.b.slice()); this.n=0; } }
      return true; } }
    registerProcessor('cap', Cap);`;
  const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  const node = new AudioWorkletNode(ctx, 'cap');
  srcNode.connect(node);
  node.port.onmessage = e => onChunk(e.data);

  voiceOn = true; muted = false;
  $('#mute').classList.remove('off');
  connectWs();
}

function onChunk(f32) {
  if (!ws || ws.readyState !== 1 || muted) return;
  // Client-side barge-in: the server only runs turn detection when no
  // response is in flight, so cutting a reply short is the client's job.
  if (speaking) {
    let sum = 0;
    for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    if (Math.sqrt(sum / f32.length) > BARGE_RMS) {
      if (++loudRun >= BARGE_HOLD) {
        ws.send(JSON.stringify({ type: 'response.cancel' }));
        stopAudio(); loudRun = 0; commitVoiceReply(true);
      }
    } else loudRun = 0;
  }
  ws.send(JSON.stringify({ type: 'input_audio_buffer.append', audio: toB64(f32) }));
}

// A finished (or interrupted) spoken reply joins the same thread the typed
// ones are in — one model context means one conversation, and the UI should
// not pretend otherwise.
function commitVoiceReply(interrupted) {
  if (vLive.trim()) {
    const m = addMsg('bot', vLive.trim() + (interrupted ? ' …' : ''), VOICE_TAG);
    m.querySelector('.body').classList.remove('cursor');
  }
  vLive = ''; liveBot = null;
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/v1/realtime');
  ws.onopen  = () => { $('#dot').className = 'on'; $('#vstate').textContent = 'listening — just start talking'; };
  ws.onerror = () => { $('#vstate').textContent = 'connection failed'; };
  ws.onclose = () => { $('#dot').className = ''; stopAudio(); if (voiceOn) $('#vstate').textContent = 'disconnected'; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    switch (m.type) {
      case 'input_audio_buffer.speech_started': $('#vstate').textContent = 'hearing you…'; break;
      case 'input_audio_buffer.speech_stopped': $('#vstate').textContent = 'thinking…';    break;
      case 'response.created': vLive = ''; $('#vsaid').textContent = ''; break;
      case 'response.output_audio_transcript.delta':
        vLive += m.delta; $('#vsaid').textContent = vLive; break;
      case 'response.output_audio.delta':
        enqueue(fromB64(m.delta)); $('#vstate').textContent = 'speaking'; break;
      case 'response.done':
        commitVoiceReply(false);
        $('#vstate').textContent = 'listening';
        break;
      case 'error':
        // Empty-buffer errors are routine chatter in a quiet room.
        if (m.error && m.error.code !== 'input_audio_buffer_commit_empty') {
          $('#vstate').textContent = m.error.message || m.error.code;
        }
        break;
    }
  };
}

function closeVoice() {
  voiceOn = false;
  commitVoiceReply(true);
  if (ws) ws.close();
  stopAudio();
  if (mic) mic.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  ctx = null; inAn = outAn = null;
  $('#voice').classList.remove('open');
  $('#vsaid').textContent = '';
}

$('#mic').onclick  = () => voiceOn ? closeVoice() : openVoice();
$('#hang').onclick = closeVoice;
$('#mute').onclick = () => { muted = !muted; $('#mute').classList.toggle('off', muted);
                             $('#vstate').textContent = muted ? 'muted' : 'listening'; };
addEventListener('keydown', e => { if (e.key === 'Escape' && voiceOn) closeVoice(); });

// ── orb ───────────────────────────────────────────────────────────────
// One ring driven by whichever side has the floor, so the picture answers
// "who is talking" without reading anything. Idle breathes rather than
// sitting flat, so a working-but-quiet session does not look frozen.
const cv = $('#orb'), g = cv.getContext('2d');
let phase = 0;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw() {
  requestAnimationFrame(draw);
  if (!$('#voice').classList.contains('open')) return;

  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2, base = Math.min(w, h) * 0.24;
  phase += 0.012;

  const an   = speaking ? outAn : inAn;
  const tint = speaking ? css('--speak') : css('--listen');
  let data = null;
  if (an) { data = new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(data); }

  let energy = 0;
  if (data) { for (let i = 0; i < 48; i++) energy += data[i]; energy /= 48 * 255; }
  if (muted && !speaking) { energy = 0; data = null; }

  const radius = base * (1 + Math.sin(phase) * 0.02) * (1 + energy * 0.22);

  // The outer stop must reach zero before the NEAREST edge, or the gradient
  // is still opaque where it gets clipped and the glow renders as a square.
  const halo = g.createRadialGradient(cx, cy, radius * 0.55, cx, cy, Math.min(w, h) * 0.5);
  halo.addColorStop(0, tint); halo.addColorStop(1, 'transparent');
  g.globalAlpha = 0.10 + energy * 0.26;
  g.fillStyle = halo; g.fillRect(0, 0, w, h);
  g.globalAlpha = 1;

  const BARS = 72;
  g.lineCap = 'round'; g.lineWidth = 2.5; g.strokeStyle = tint;
  for (let i = 0; i < BARS; i++) {
    const a = (i / BARS) * Math.PI * 2 - Math.PI / 2;
    // Mirrored around the circle: a sweep would imply a direction that is
    // not there.
    const bin = i < BARS / 2 ? i : BARS - i;
    const v = data ? data[Math.floor(bin * 1.6)] / 255 : 0;
    const len = 5 + v * base * 0.58 + Math.sin(phase * 2 + i * 0.35) * 1.8;
    g.globalAlpha = 0.3 + v * 0.65;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    g.lineTo(cx + Math.cos(a) * (radius + len), cy + Math.sin(a) * (radius + len));
    g.stroke();
  }
  g.globalAlpha = 0.5 + energy * 0.4; g.lineWidth = 1.5;
  g.beginPath(); g.arc(cx, cy, radius, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = 1;
}
draw();
sync();
</script>
