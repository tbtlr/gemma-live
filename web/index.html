<!doctype html>
<meta charset="utf-8">
<title>gemma-live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:      #0b0d10;
    --panel:   #12161b;
    --line:    #1e252d;
    --text:    #e6edf3;
    --dim:     #7d8996;
    --listen:  #4aa3ff;
    --speak:   #ffb454;
    --bad:     #ff5f56;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 20px;
    -webkit-font-smoothing: antialiased;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .2px; margin: 0; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.on  { background: #3fb950; }
  #dot.err { background: var(--bad); }
  #state { color: var(--dim); font-size: 13px; min-height: 20px; margin-bottom: 14px;
           font-variant-numeric: tabular-nums; }

  #stage { position: relative; width: min(80vw, 400px); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }

  #go {
    position: absolute; inset: 0; margin: auto; width: 128px; height: 128px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit; font-weight: 550; cursor: pointer;
    transition: border-color .15s, transform .15s, opacity .2s;
  }
  #go:hover { border-color: #33404d; transform: scale(1.02); }
  #go.hide  { opacity: 0; pointer-events: none; }

  #script {
    width: min(92vw, 560px); margin-top: 18px; flex: 1; min-height: 0;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: thin;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bub {
    max-width: 82%; padding: 8px 13px; border-radius: 15px; white-space: pre-wrap;
    border: 1px solid var(--line); background: var(--panel);
  }
  .me  .bub { color: var(--dim); font-style: italic; }
  .gem .bub { border-bottom-left-radius: 5px; }
  .gem.live .bub::after {
    content: "▌"; color: var(--speak); animation: blink 1s steps(2) infinite; margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer { color: var(--dim); font-size: 12px; margin-top: 12px; text-align: center; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
        background: var(--panel); font: inherit; font-size: 11px; }
  /* No keyboard to press on a touch device — tap the ring instead. */
  @media (pointer: coarse) { #keyhint { display: none; } }
</style>

<header><span id="dot"></span><h1>gemma-live</h1></header>
<div id="state">not connected</div>

<div id="stage">
  <canvas id="viz"></canvas>
  <button id="go">Start</button>
</div>

<div id="script"></div>
<footer>Speak to interrupt<span id="keyhint"> · <kbd>Space</kbd> to stop</span></footer>

<script>
// ── constants ───────────────────────────────────────────────────────────
// The Realtime protocol carries mono PCM16 at 24 kHz. Asking the
// AudioContext for that rate makes the browser do both conversions for us,
// on the audio thread, instead of us resampling in JS.
const RATE = 24000;
const CHUNK = 2400;            // 100 ms per append — same cadence the app pumps at

// Barge-in threshold on the ALREADY echo-cancelled mic. getUserMedia's AEC
// removes Gemma's own voice, so anything left above the floor while she is
// speaking is the user talking over her — the same double-talk reasoning
// the desktop app applies to the AEC residual, with the browser doing the
// cancelling.
const BARGE_RMS   = 0.02;
const BARGE_HOLD  = 3;         // consecutive loud chunks before cutting

let ws, ctx, mic, micNode, inAnalyser, outAnalyser, outGain;
let playCursor = 0, sources = [], loudRun = 0;
let speaking = false, running = false;
let liveRow = null;

const $ = s => document.querySelector(s);
const setState = t => $('#state').textContent = t;

// ── transcript ──────────────────────────────────────────────────────────
function addRow(who, text) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bub';
  b.textContent = text;
  row.appendChild(b);
  $('#script').appendChild(row);
  $('#script').scrollTop = $('#script').scrollHeight;
  return row;
}

// ── audio helpers ───────────────────────────────────────────────────────
function floatToB64(f32) {
  const pcm = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const bytes = new Uint8Array(pcm.buffer);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}

function b64ToFloat(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(bytes.buffer);
  const f32 = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f32[i] = pcm[i] / 32768;
  return f32;
}

function stopPlayback() {
  for (const s of sources) { try { s.stop(); } catch (e) {} }
  sources = [];
  playCursor = 0;
  speaking = false;
}

function enqueue(f32) {
  const buf = ctx.createBuffer(1, f32.length, RATE);
  buf.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(outGain);
  // A small lead the first time so the first chunk is not already late;
  // after that each chunk is scheduled exactly where the previous ended,
  // which is what keeps playback gapless.
  const now = ctx.currentTime;
  if (playCursor < now) playCursor = now + 0.06;
  src.start(playCursor);
  playCursor += buf.duration;
  sources.push(src);
  src.onended = () => {
    sources = sources.filter(s => s !== src);
    if (!sources.length) speaking = false;
  };
  speaking = true;
}

// ── session ─────────────────────────────────────────────────────────────
async function start() {
  $('#go').classList.add('hide');
  setState('requesting microphone…');

  try {
    // Browser-side echo cancellation. This is the whole reason the server
    // never needs a far-end reference: the client owns AEC, exactly as the
    // Realtime API assumes.
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true,
               autoGainControl: true, channelCount: 1 }
    });
  } catch (e) {
    $('#dot').className = 'err';
    setState('microphone denied — ' + e.message);
    $('#go').classList.remove('hide');
    return;
  }

  ctx = new AudioContext({ sampleRate: RATE });
  await ctx.resume();

  outGain     = ctx.createGain();
  outAnalyser = ctx.createAnalyser();
  outAnalyser.fftSize = 512;
  outGain.connect(outAnalyser).connect(ctx.destination);

  const srcNode = ctx.createMediaStreamSource(mic);
  inAnalyser = ctx.createAnalyser();
  inAnalyser.fftSize = 512;
  srcNode.connect(inAnalyser);

  // Capture worklet, from a Blob so the whole UI stays one file. It
  // batches to CHUNK before posting: at 128 frames a callback this would
  // otherwise be ~190 messages a second for no benefit.
  const code = `
    class Cap extends AudioWorkletProcessor {
      constructor() { super(); this.buf = new Float32Array(${CHUNK}); this.n = 0; }
      process(inputs) {
        const ch = inputs[0][0];
        if (!ch) return true;
        for (let i = 0; i < ch.length; i++) {
          this.buf[this.n++] = ch[i];
          if (this.n === ${CHUNK}) { this.port.postMessage(this.buf.slice()); this.n = 0; }
        }
        return true;
      }
    }
    registerProcessor('cap', Cap);`;
  const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  micNode = new AudioWorkletNode(ctx, 'cap');
  srcNode.connect(micNode);
  micNode.port.onmessage = e => onMicChunk(e.data);

  connect();
  running = true;
  draw();
}

function onMicChunk(f32) {
  if (!ws || ws.readyState !== 1) return;

  // Client-side barge-in. The server only runs turn detection when no
  // response is in flight, so cutting Gemma off is the client's job — and
  // the client is the side that can hear the room anyway.
  if (speaking) {
    let sum = 0;
    for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    if (Math.sqrt(sum / f32.length) > BARGE_RMS) {
      if (++loudRun >= BARGE_HOLD) {
        ws.send(JSON.stringify({ type: 'response.cancel' }));
        stopPlayback();
        loudRun = 0;
        if (liveRow) { liveRow.classList.remove('live'); liveRow = null; }
      }
    } else loudRun = 0;
  }

  ws.send(JSON.stringify({ type: 'input_audio_buffer.append', audio: floatToB64(f32) }));
}

function connect() {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/v1/realtime';
  setState('connecting…');
  ws = new WebSocket(url);

  ws.onopen = () => { $('#dot').className = 'on'; setState('listening'); };

  ws.onclose = () => {
    $('#dot').className = '';
    setState(running ? 'disconnected' : 'not connected');
    stopPlayback();
  };

  ws.onerror = () => { $('#dot').className = 'err'; setState('connection failed'); };

  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    switch (m.type) {
      case 'session.created':
        setState('listening — just start talking');
        break;
      case 'input_audio_buffer.speech_started':
        setState('hearing you…');
        addRow('me', 'speaking…').dataset.tmp = '1';
        break;
      case 'input_audio_buffer.speech_stopped':
        setState('thinking…');
        document.querySelectorAll('[data-tmp]').forEach(n => n.remove());
        break;
      case 'response.created':
        liveRow = addRow('gem', '');
        liveRow.classList.add('live');
        break;
      case 'response.output_audio_transcript.delta':
        if (liveRow) {
          liveRow.querySelector('.bub').textContent += m.delta;
          $('#script').scrollTop = $('#script').scrollHeight;
        }
        break;
      case 'response.output_audio.delta':
        enqueue(b64ToFloat(m.delta));
        setState('speaking');
        break;
      case 'response.done':
        if (liveRow) liveRow.classList.remove('live');
        liveRow = null;
        setState('listening');
        break;
      case 'error':
        // The empty-buffer errors are routine chatter when the room is
        // quiet; only surface things a person can act on.
        if (m.error && m.error.code !== 'input_audio_buffer_commit_empty') {
          setState('error: ' + (m.error.message || m.error.code));
        }
        break;
    }
  };
}

function stop() {
  running = false;
  if (ws) ws.close();
  stopPlayback();
  if (mic) mic.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  $('#go').classList.remove('hide');
  setState('stopped');
  $('#dot').className = '';
}

// ── animation ───────────────────────────────────────────────────────────
//
// One ring of radial bars driven by whichever side currently has the
// floor, so the picture always answers "who is talking" at a glance:
// blue while it is hearing you, amber while Gemma speaks. Idle is a slow
// breath rather than a flat line, so a working-but-quiet session does not
// look like a frozen one.
const cv = $('#viz'), g = cv.getContext('2d');
let phase = 0;

function levels(an) {
  const n = an.frequencyBinCount;
  const d = new Uint8Array(n);
  an.getByteFrequencyData(d);
  return d;
}

function draw() {
  requestAnimationFrame(draw);

  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const base = Math.min(w, h) * 0.24;
  phase += 0.012;

  const active = speaking ? outAnalyser : inAnalyser;
  const tint   = speaking ? '255,180,84' : '74,163,255';
  const data   = active ? levels(active) : null;

  let energy = 0;
  if (data) {
    for (let i = 0; i < 48; i++) energy += data[i];
    energy /= 48 * 255;
  }

  // Idle breath keeps the ring alive when nothing is happening.
  const breath = 1 + Math.sin(phase) * 0.02;
  const radius = base * breath * (1 + energy * 0.22);

  // Halo. The outer stop has to reach zero before the NEAREST canvas edge,
  // or the gradient is still opaque where it gets clipped and the glow
  // renders as a visible square.
  const reach = Math.min(w, h) * 0.5;
  const halo = g.createRadialGradient(cx, cy, radius * 0.55, cx, cy, reach);
  halo.addColorStop(0, `rgba(${tint},${0.10 + energy * 0.26})`);
  halo.addColorStop(1, `rgba(${tint},0)`);
  g.fillStyle = halo;
  g.fillRect(0, 0, w, h);

  // Radial bars
  const BARS = 72;
  g.lineCap = 'round';
  for (let i = 0; i < BARS; i++) {
    const a = (i / BARS) * Math.PI * 2 - Math.PI / 2;
    // Mirror the spectrum around the circle so it reads symmetrically
    // rather than sweeping — a sweep implies direction that is not there.
    const bin = i < BARS / 2 ? i : BARS - i;
    const v   = data ? data[Math.floor(bin * 1.6)] / 255 : 0;
    const len = 5 + v * base * 0.58 + Math.sin(phase * 2 + i * 0.35) * 1.8;
    const x1 = cx + Math.cos(a) * radius,       y1 = cy + Math.sin(a) * radius;
    const x2 = cx + Math.cos(a) * (radius + len), y2 = cy + Math.sin(a) * (radius + len);
    g.strokeStyle = `rgba(${tint},${0.30 + v * 0.65})`;
    g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }

  // Core ring
  g.strokeStyle = `rgba(${tint},${0.5 + energy * 0.4})`;
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(cx, cy, radius, 0, Math.PI * 2); g.stroke();
}
draw();

// ── input ───────────────────────────────────────────────────────────────
$('#go').onclick = start;
$('#viz').onclick = () => { if (running) stop(); };
addEventListener('keydown', e => {
  if (e.code === 'Space' && running) { e.preventDefault(); stop(); }
});
</script>
