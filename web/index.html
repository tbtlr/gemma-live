<!-- The two families ai.google.dev/gemma itself loads. Google Symbols is
     subsetted to the four glyphs used here: the whole font is 2.5 MB, these
     are 4 KB. Both are served from Google's CDN rather than vendored — see

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Symbols:opsz,wght,FILL,GRAD,ROND@24,100..700,0..1,0..200,100&icon_names=arrow_upward,check,close,graphic_eq,mic,mic_off,stop&display=swap">
<style>
/* Design tokens lifted verbatim from llama.cpp's web UI (tools/ui/src/app.css)
   so this sits in the same visual family: shadcn neutral in oklch, one radius. */
:root {
  --radius: 0.625rem;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.95 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.95 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.875 0 0);
  --input: oklch(0.92 0 0);
  --ring: oklch(0.708 0 0);
  /* Gemma speaks in her own blue — the middle stop of the logo gradient
     (#446EFF -> #2E96FF -> #B1C5FF), so the ribbon and the mark come from
     the same palette. The microphone gets the page's own foreground, which
     is white here and near-black under a light theme; a literal white would
     be invisible on the light one, and unlike the favicon there is no tile
     to sit it on. */
  --speak:  #2E96FF;
  --listen: var(--foreground);
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Monaco, 'Cascadia Code', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.16 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.29 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 14%);
    --input: oklch(1 0 0 / 18%);
    --ring: oklch(0.556 0 0);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font: 15px/1.6 'Google Sans Flex', ui-sans-serif, -apple-system, 'SF Pro Text',
        Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* ── header ───────────────────────────────────────────────────────── */
header {
  /* Proportions taken from Google's own Gemma lockup: the mark stands 1.69x
     the wordmark's cap height, separated by 0.18 of that cap. At an 18px
     wordmark that puts the mark at 22px and the gap at 2px.
     align-items does the centring — measured against a real baseline the
     mark lands 0.5px off the cap centre, and a hand-tuned nudge here was
     wrong by 1.8px in the other direction. */
  display: flex; align-items: center; gap: 2px;
  padding: 12px 16px; border-bottom: 1px solid var(--border); flex: none;
}
header b { font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
/* Google's Gemma mark, monochrome variant — the same geometry as the
   gradient one, drawn in currentColor. Inheriting the header's colour is
   what makes it work in both themes: white on the dark ground, near-black
   on the light one. A literal white fill would vanish in light mode.

   Not below about 20px: the mark is a diamond inside a ringed crosshair,
   and under that those hairlines blur into an indistinct sparkle. */
.mark { width: 22px; height: 22px; flex: none; display: block; }

/* ── conversation ─────────────────────────────────────────────────── */
main { flex: 1; overflow-y: auto; }
#thread { max-width: 46rem; margin: 0 auto; padding: 28px 16px 8px;
          display: flex; flex-direction: column; gap: 22px; }
.msg.user  { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.msg.user .body {
  background: var(--secondary); color: var(--secondary-foreground);
  padding: 9px 15px; border-radius: 999px; max-width: 80%;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.bot .body { width: 100%; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot .info { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.cursor::after { content: '▍'; opacity: .6; animation: blink 1.1s steps(2) infinite; }
/* Waiting on the transcript: a bubble the width of a few words, pulsing, so
   the turn is visible before the words are. */
.pending { min-width: 3.2rem; min-height: 1.5em; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes blink { 50% { opacity: 0; } }

#empty { display: none; color: var(--muted-foreground); text-align: center;
         padding: 0 0 12px; }
body.blank #empty { display: block; }

/* Empty thread: the greeting and the composer sit together in the middle of
   the page and drop into place on the first message. The paired auto margins
   split the free space above main and below footer, which centres the pair
   without a wrapper element to add and then unwind. */
body.blank main    { flex: 0 0 auto; margin-top: auto; overflow: visible; }
body.blank footer  { margin-bottom: auto; }
body.blank #thread { padding-top: 0; }
#empty h2 { color: var(--foreground); font-size: 24px; font-weight: 400;
             letter-spacing: -.015em; margin: 0; }

/* ── composer ─────────────────────────────────────────────────────── */
/* A little more room below the composer than the hint used to leave, so
   dropping it does not leave the box sitting on the window edge. */
footer { flex: none; padding: 10px 16px calc(22px + env(safe-area-inset-bottom)); }
#composer {
  max-width: 46rem; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px;
  border: 1px solid var(--input); border-radius: 1.6rem; padding: 7px 7px 7px 16px;
  background: var(--card); transition: border-color .15s;
}
#composer:focus-within { border-color: var(--ring); }
#box {
  flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit;
  font: inherit; padding: 7px 0; max-height: 40vh; line-height: 1.5;
}
#box::placeholder { color: var(--muted-foreground); }
.icon {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  transition: opacity .15s, background-color .15s;
}
.icon:hover { background-color: var(--accent); }

/* Google Symbols ligatures, hidden until the font is confirmed loaded.
   The gate is not decoration: the icon font is declared font-display: swap,
   so without it every button would flash its ligature — the literal word
   "mic_off", "close" — in the fallback face while the font downloads, and
   would keep showing it forever with no network. An empty button that still
   works beats one labelled "mic_off". */
.gs {
  font-family: 'Google Symbols'; font-weight: normal; font-style: normal;
  font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none;
  white-space: nowrap; word-wrap: normal; direction: ltr;
  -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  /* Google's own pages ask for wght 100..300 at opsz 48, which is drawn for
     large display and reads thin at 20px. opsz matches the render size, and
     wght 350 with a little GRAD sits between the settings that read as too
     thin and too heavy — GRAD being the axis whose whole job is
     thickening strokes on a dark ground without changing the footprint. */
  font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 50, 'opsz' 24, 'ROND' 100;
  display: none;
}
body.gsym .gs  { display: block; }
.icon.filled { background-color: var(--primary); color: var(--primary-foreground); }
.icon.filled:hover { opacity: .85; background-color: var(--primary); }
/* Keep the shape when there is nothing to send. Dropping the fill and
   dimming to 0.35 left it invisible against a dark ground, which reads as
   a missing button rather than an inactive one. */
.icon:disabled { cursor: default; }
.icon.filled:disabled {
  background-color: var(--muted); color: var(--muted-foreground); opacity: 1;
}
.icon.filled:disabled:hover { background-color: var(--muted); opacity: 1; }
/* One affordance at a time: the composer offers voice until you type, then
   offers send. Two buttons side by side made you choose before you had
   decided anything. */
#composer.typing #mic         { display: none; }
#composer.typing #dict        { display: none; }
body.voice #dict              { display: none; }   /* already listening */

/* Dictating: the text field gives way to a live waveform and the microphone
   to a discard/keep pair, so the only choices on screen are the two that
   exist. Nothing is written into the box until you keep it. */
/* flex-basis 0 with width:0. drawWave writes canvas.width from the measured
   layout width each frame, and a canvas's intrinsic width participates in
   flex sizing unless the basis is zero — so the two can feed back. Belt and
   braces rather than an observed failure. */
#wave { display: none; flex: 1 1 0; width: 0; min-width: 0;
        height: 36px; align-self: center; }
body.dictating #wave   { display: block; }
body.dictating #box,
body.dictating #dict,
body.dictating #mic,
body.dictating #send,
body.dictating .round  { display: none; }
#cancel, #accept       { display: none; }
body.dictating #cancel,
body.dictating #accept { display: grid; }
#accept.working { opacity: .55; }
#composer:not(.typing) #send  { display: none; }
/* Same rule in voice mode: once there is something to send, sending is the
   only thing the box should offer. Mute and end come back when it empties. */
#composer.typing .round       { display: none; }

/* ── voice overlay ────────────────────────────────────────────────── */
/* Voice mode occupies the conversation area, not the whole window: the
   composer stays live underneath so a thought that is easier typed than
   spoken does not require leaving voice mode first. */
#voice { display: none; }
body.voice #voice {
  display: flex; flex: 1; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; padding: 8px 16px;
}
body.voice #thread { display: none; }
/* The blank-state centring would fight the visualiser for the free space. */
/* main must be a flex CONTAINER here, or #voice's flex:1 has nothing to
   fill against and the visualiser hangs off the top of the area. */
body.voice main   { flex: 1; margin-top: 0; overflow: hidden; display: flex; }
body.voice footer { margin-bottom: 0; }
/* Already in voice mode — the button that gets you there is noise here. */
body.voice #mic   { display: none; }

/* Wider than it is tall: the ribbon runs horizontally, so a square box
   would be mostly empty above and below it. */
#viz { width: min(82vw, 460px); height: min(34vw, 190px); }
/* Failures only. The ribbon already says listening / speaking / muted
   better than a caption can, but a denied microphone or a dropped socket
   has to be visible or it just sits there looking fine. */
#vstate { color: var(--destructive); font-size: 13px; }
#vstate:empty { display: none; }

/* Mute and end sit inside the composer, right-aligned beside the other
   affordances, so voice mode adds controls to the box rather than building
   a second row around it. Same 36px box as the send button. */
/* Mute carries no chrome at rest — it is a glyph like the others in the
   box — and only takes a fill once it is actually muting something. End
   keeps its solid treatment because it is the destructive-ish action. */
.round { display: none; }
body.voice #composer:not(.typing) .round { display: grid; }
.round:hover { background-color: var(--accent); opacity: 1; }
.round.off { background-color: var(--destructive); color: oklch(0.985 0 0); }
.round.off:hover { background-color: var(--destructive); opacity: .85; }
.round.end { background-color: var(--primary); color: var(--primary-foreground); }
.round.end:hover { background-color: var(--primary); opacity: .85; }
</style>

<header>
  <svg class="mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="Gemma">
    <path fill="currentColor" fill-rule="evenodd" d="M12.34 5.953a8.233 8.233 0 01-.247-1.125V3.72a8.25 8.25 0 015.562 2.232H12.34zm-.69 0c.113-.373.199-.755.257-1.145V3.72a8.25 8.25 0 00-5.562 2.232h5.304zm-5.433.187h5.373a7.98 7.98 0 01-.267.696 8.41 8.41 0 01-1.76 2.65L6.216 6.14zm-.264-.187H2.977v.187h2.915a8.436 8.436 0 00-2.357 5.767H0v.186h3.535a8.436 8.436 0 002.357 5.767H2.977v.186h2.976v2.977h.187v-2.915a8.436 8.436 0 005.767 2.357V24h.186v-3.535a8.436 8.436 0 005.767-2.357v2.915h.186v-2.977h2.977v-.186h-2.915a8.436 8.436 0 002.357-5.767H24v-.186h-3.535a8.436 8.436 0 00-2.357-5.767h2.915v-.187h-2.977V2.977h-.186v2.915a8.436 8.436 0 00-5.767-2.357V0h-.186v3.535A8.436 8.436 0 006.14 5.892V2.977h-.187v2.976zm6.14 14.326a8.25 8.25 0 005.562-2.233H12.34c-.108.367-.19.743-.247 1.126v1.107zm-.186-1.087a8.015 8.015 0 00-.258-1.146H6.345a8.25 8.25 0 005.562 2.233v-1.087zm-8.186-7.285h1.107a8.23 8.23 0 001.125-.247V6.345a8.25 8.25 0 00-2.232 5.562zm1.087.186H3.72a8.25 8.25 0 002.232 5.562v-5.304a8.012 8.012 0 00-1.145-.258zm15.47-.186a8.25 8.25 0 00-2.232-5.562v5.315c.367.108.743.19 1.126.247h1.107zm-1.086.186c-.39.058-.772.144-1.146.258v5.304a8.25 8.25 0 002.233-5.562h-1.087zm-1.332 5.69V12.41a7.97 7.97 0 00-.696.267 8.409 8.409 0 00-2.65 1.76l3.346 3.346zm0-6.18v-5.45l-.012-.013h-5.451c.076.235.162.468.26.696a8.698 8.698 0 001.819 2.688 8.698 8.698 0 002.688 1.82c.228.097.46.183.696.259zM6.14 17.848V12.41c.235.078.468.167.696.267a8.403 8.403 0 012.688 1.799 8.404 8.404 0 011.799 2.688c.1.228.19.46.267.696H6.152l-.012-.012zm0-6.245V6.326l3.29 3.29a8.716 8.716 0 01-2.594 1.728 8.14 8.14 0 01-.696.259zm6.257 6.257h5.277l-3.29-3.29a8.716 8.716 0 00-1.728 2.594 8.135 8.135 0 00-.259.696zm-2.347-7.81a9.435 9.435 0 01-2.88 1.96 9.14 9.14 0 012.88 1.94 9.14 9.14 0 011.94 2.88 9.435 9.435 0 011.96-2.88 9.14 9.14 0 012.88-1.94 9.435 9.435 0 01-2.88-1.96 9.434 9.434 0 01-1.96-2.88 9.14 9.14 0 01-1.94 2.88z"/>
  </svg>
  <b>Gemma Live</b>
</header>

<main>
  <div id="thread">
    <div id="empty"><h2 id="greet"></h2></div>
  </div>

  <div id="voice">
    <canvas id="viz"></canvas>
    <div id="vstate"></div>
  </div>
</main>

<footer>
  <form id="composer">
    <textarea id="box" rows="1" placeholder="Ask anything" autocomplete="off"></textarea>
    <canvas id="wave" aria-hidden="true"></canvas>
    <button type="button" class="icon" id="cancel" title="Discard" aria-label="Discard">
      <span class="gs">close</span>
    </button>
    <button type="button" class="icon filled" id="accept" title="Use it" aria-label="Use it">
      <span class="gs">check</span>
    </button>
    <button type="button" class="icon" id="dict" title="Dictate" aria-label="Dictate">
      <span class="gs">mic</span>
    </button>
    <button type="button" class="icon filled" id="mic" title="Voice mode" aria-label="Voice mode">
      <span class="gs">graphic_eq</span>
    </button>
    <button type="submit" class="icon filled" id="send" title="Send" aria-label="Send" disabled>
      <span class="gs">arrow_upward</span>
    </button>
    <button type="button" class="icon round" id="mute" title="Mute" aria-label="Mute">
      <span class="gs">mic_off</span>
    </button>
    <button type="button" class="icon round end" id="hang" title="End voice mode" aria-label="End voice mode">
      <span class="gs">close</span>
    </button>
  </form>
</footer>

<script>
const $ = s => document.querySelector(s);
const RATE = 24000, CHUNK = 2400;
// Barge-in threshold on the already-echo-cancelled mic: getUserMedia's AEC
// removes Gemma's own voice, so whatever is left above the floor while she
// speaks is the user talking over her.
const BARGE_RMS = 0.02, BARGE_HOLD = 3;

let ws, ctx, mic, inAn, outAn, outGain;
let playCursor = 0, sources = [], loudRun = 0;
let speaking = false, voiceOn = false, muted = false, busy = false;
let liveBot = null, wsResponding = false, httpSpeaking = false;

// Copy of the audio sent for the turn in progress, kept so the user's own
// words can be shown in the thread. Gemma consumes audio as tokens and never
// emits a transcript of it, so the row is filled by /api/transcribe — a
// different model, off the turn lock, running alongside the reply rather
// than in front of it. Nothing waits on it: the row appears immediately and
// the words arrive when they arrive.
let turnAudio = [];

// Per-turn timing as the page experiences it. The server logs its own half;
// the difference between the two ttfa numbers is transport plus the
// playback scheduler's lead, which is exactly what the server cannot see.
let turnT0 = 0, turnFirstTok = 0, turnFirstAudio = 0;
function turnMark(what) {
  const t = performance.now();
  if (what === 'start') { turnT0 = t; turnFirstTok = turnFirstAudio = 0; }
  if (what === 'tok'   && !turnFirstTok)   turnFirstTok   = t;
  if (what === 'audio' && !turnFirstAudio) turnFirstAudio = t;
}
function turnReport(kind) {
  if (!turnT0) return;
  const r = n => n ? Math.round(n - turnT0) + ' ms' : '—';
  console.log(`[${kind}] ttft ${r(turnFirstTok)} | ttfa ${r(turnFirstAudio)}`
            + ` | done ${r(performance.now())}`);
  turnT0 = 0;
}

// ── thread ────────────────────────────────────────────────────────────
// The blank state is derived from the thread, not toggled by hand. It used
// to be switched off the first time a row appeared and never switched back,
// so a voice turn whose row was removed again — nothing intelligible, or a
// reply with no text — left the greeting gone and the composer stranded at
// the bottom of an empty page.
function refreshBlank() {
  document.body.classList.toggle('blank',
    document.querySelectorAll('#thread .msg').length === 0);
}

function addMsg(who, text) {
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'body'; b.textContent = text;
  m.appendChild(b);
  $('#thread').appendChild(m);
  refreshBlank();
  scroll();
  return m;
}
const scroll = () => { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; };

// ── text chat ─────────────────────────────────────────────────────────
async function sendText(text) {
  if (busy) return;
  busy = true; sync();
  addMsg('user', text);
  turnMark('start');
  const bot = addMsg('bot', '');
  const body = bot.querySelector('.body');
  body.classList.add('cursor');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      // In voice mode a typed aside is still part of a spoken conversation,
      // so ask for it out loud and play it through the same graph.
      body: JSON.stringify({ message: text, speak: voiceOn })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const m = JSON.parse(line.slice(6));
        if (m.delta) { turnMark('tok'); body.textContent += m.delta; scroll(); }
        if (m.audio && ctx) { turnMark('audio'); httpSpeaking = true; enqueue(fromB64(m.audio)); }
        if (m.error) { body.textContent += '\n[' + m.error + ']'; }
        if (m.done) {
          const info = document.createElement('div');
          info.className = 'info';
          info.textContent = `${m.tokens} tokens · ${m.ms} ms`;
          bot.appendChild(info);
        }
      }
    }
  } catch (err) {
    body.textContent += (body.textContent ? '\n' : '') + '[' + err.message + ']';
  } finally {
    body.classList.remove('cursor');
    turnReport(voiceOn ? 'text spoken' : 'text');
    busy = false; sync(); scroll();
  }
}

// ── dictation ─────────────────────────────────────────────────────────
//
// Speech into the composer, as distinct from voice mode: the words land in
// the box for you to edit, and nothing is sent until you send it.
//
// While recording, the text field is replaced by a live waveform and the
// microphone by discard/keep. Nothing is written into the box until you
// keep it — a half-transcribed sentence appearing and rewriting itself as
// you talk is noise, and the waveform already says the microphone is live.
// So there is no polling either: one pass over the whole take on keep.
//
// Its own microphone and AudioContext rather than voice mode's, because the
// two are mutually exclusive and sharing would mean rebuilding the graph on
// every switch.
let dictCtx = null, dictMic = null, dictNode = null;
let dictChunks = [], dictAmps = [], dictOn = false;

// Amplitude samples per 100 ms chunk. This sets the scroll speed: the strip holds
// ~60 dots, so 5 slices a chunk showed barely a second of audio and raced.
// 2 gives ~20 a second — three seconds across the strip, and each dot still
// spans 50 ms, well inside a syllable, so it stays lively rather than
// averaging speech into a flat line.
const LEVEL_SLICES = 2;

// Room tone, tracked live. A fixed RMS cut cannot separate silence from
// speech here: autoGainControl normalises the signal per microphone and per
// room, so the level of "quiet" after gain is a property of the environment,
// not a constant. Too low and silence draws as speech; too high and the
// first syllable is clipped off.
let noiseFloor = 0;
// How fast the floor chases the level, by case. Drop onto a new quiet level
// in a few slices; follow the room upward briskly while what we are hearing
// is NOT speech; and during speech only creep, so a long steady vowel cannot
// drag the floor up behind it. The creep is not optional -- without it a
// floor left too low by a dropout would call room tone speech forever, and
// never see a non-speech slice to correct itself with.
const NF_FALL = 0.5, NF_TRACK = 0.15, NF_RISE = 0.004;
// Speech has to clear the floor by this much. Room tone wanders by tens of
// percent between slices; a spoken syllable is several times louder.
const SPEECH_RATIO = 2.2;
// ...and by this absolute margin too, or a digitally silent input — floor 0,
// so any ratio of it is also 0 — would count its own dropout as speech.
const SPEECH_MIN = 0.002;

async function dictStart() {
  try {
    dictMic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true,
               autoGainControl: true, channelCount: 1 }
    });
  } catch (err) {
    $('#vstate').textContent = 'microphone denied — ' + err.message;
    return;
  }
  dictCtx = new AudioContext({ sampleRate: RATE });
  await dictCtx.resume();
  const code = `class Cap extends AudioWorkletProcessor {
    constructor(){ super(); this.b = new Float32Array(${CHUNK}); this.n = 0; }
    process(i){ const c = i[0][0]; if(!c) return true;
      for (let k=0;k<c.length;k++){ this.b[this.n++]=c[k];
        if(this.n===${CHUNK}){ this.port.postMessage(this.b.slice()); this.n=0; } }
      return true; } }
    registerProcessor('cap', Cap);`;
  const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  await dictCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  const src = dictCtx.createMediaStreamSource(dictMic);
  dictNode = new AudioWorkletNode(dictCtx, 'cap');
  src.connect(dictNode);
  dictChunks = [];
  dictAmps = [];
  noiseFloor = 0;
  dictNode.port.onmessage = e => {
    dictChunks.push(e.data);
    // A few levels per chunk, so the waveform moves at speech speed rather
    // than in 100 ms steps.
    const f = e.data, per = Math.floor(f.length / LEVEL_SLICES);
    for (let k = 0; k < LEVEL_SLICES; k++) {
      let sum = 0;
      for (let i = k * per; i < (k + 1) * per; i++) sum += f[i] * f[i];
      const lvl = Math.sqrt(sum / per);
      // Seed from the very first slice instead of creeping up from zero,
      // which would take hundreds of slices and call the opening silence
      // speech the whole way.
      if (noiseFloor === 0) noiseFloor = lvl;
      // Classify against the floor as it stood BEFORE this slice, so a loud
      // one cannot raise the bar it is being measured against.
      const thr = Math.max(noiseFloor * SPEECH_RATIO, SPEECH_MIN);
      // Store what to draw, not the raw level: the floor moves, and a dot
      // must not turn into a bar after it has scrolled into view.
      const speech = lvl > thr;
      dictAmps.push(speech ? Math.min(1, Math.sqrt(lvl - thr) * 3.4) : 0);
      noiseFloor += (lvl - noiseFloor) *
                    (lvl < noiseFloor ? NF_FALL : speech ? NF_RISE : NF_TRACK);
    }
  };

  dictOn = true;
  document.body.classList.add('dictating');
  drawWave();
}

// Release the microphone; keep whatever was captured for the caller to use
// or throw away.
function dictRelease() {
  dictOn = false;
  if (dictNode) { dictNode.port.onmessage = null; dictNode.disconnect(); dictNode = null; }
  if (dictMic)  { dictMic.getTracks().forEach(t => t.stop()); dictMic = null; }
  if (dictCtx)  { dictCtx.close(); dictCtx = null; }
}

function dictReset() {
  dictChunks = []; dictAmps = [];
  document.body.classList.remove('dictating');
  $('#accept').classList.remove('working');
  sync();
}

function dictCancel() {
  dictRelease();
  dictReset();
  box.focus();
}

async function dictAccept() {
  dictRelease();
  let n = 0;
  for (const c of dictChunks) n += c.length;
  if (!n) { dictReset(); box.focus(); return; }
  const all = new Float32Array(n);
  let at = 0;
  for (const c of dictChunks) { all.set(c, at); at += c.length; }

  // The waveform stays up while this runs — the microphone is closed but
  // the words are not back yet, and dropping to an empty box would read as
  // having lost them.
  $('#accept').classList.add('working');
  try {
    const res = await fetch('/api/transcribe', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ audio: toB64(all), rate: RATE })
    });
    const text = ((await res.json()).text || '').trim();
    if (text) box.value = (box.value ? box.value.replace(/\s*$/, '') + ' ' : '') + text;
  } catch (_) {
    $('#vstate').textContent = 'could not transcribe';
  }
  dictReset();
  box.focus();
}

// ── waveform ──────────────────────────────────────────────────────────
// Dots across the strip, one per recent level, newest at the right. Dotted
// rather than a filled trace because the composer is a small strip and a
// solid waveform there reads as a progress bar.
//
// Silence is not stillness -- the microphone is open, and the strip has to
// say so. Scrolling alone cannot: every quiet column holds the same value,
// so a row of identical dots slides along looking perfectly frozen. Instead
// a slow swell of brightness and size travels through the dots, leftward
// with the history. They stay ON the midline, which is what "no signal"
// means here; lifting them off it would imply one. Bars carry their own
// motion, so only the dots take this.
const DOT_WAVELEN = 130;   // px between crests — a few of them across the strip
const DOT_SPEED   = 55;    // px a second; a given dot cycles every ~2.4 s
const wave = $('#wave'), wctx = wave.getContext('2d');
function drawWave() {
  if (!document.body.classList.contains('dictating')) return;
  requestAnimationFrame(drawWave);

  const dpr = devicePixelRatio || 1;
  const w = wave.clientWidth, h = wave.clientHeight;
  if (!w || !h) return;
  if (wave.width !== w * dpr) { wave.width = w * dpr; wave.height = h * dpr; }
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wctx.clearRect(0, 0, w, h);

  const GAP = 10, R = 1.6;   // spaced enough to read as dots, not a bar chart
  const cols = Math.floor(w / GAP);
  const mid  = h / 2;
  const t    = performance.now() / 1000;
  const cs   = getComputedStyle(document.documentElement);
  const fg   = cs.getPropertyValue('--foreground').trim();
  const dim  = cs.getPropertyValue('--muted-foreground').trim();

  for (let i = 0; i < cols; i++) {
    const x = i * GAP + GAP / 2;
    // Newest on the right: walk the tail of the amplitude history.
    const idx = dictAmps.length - cols + i;
    const amp = idx >= 0 ? (dictAmps[idx] || 0) : 0;

    // The dot goes down first and unconditionally: a column is never blank,
    // whatever the level says. A row of dots is the strip's resting state.
    //
    // As an explicit filled circle, NOT a round cap on a zero-length stroke.
    // Blink paints that degenerate subpath, WebKit skips it, so the pauses
    // came out empty in Safari however the classifier had scored them. An
    // arc has no such ambiguity.
    const swell = 0.5 + 0.5 * Math.sin(2 * Math.PI *
                  (x + t * DOT_SPEED) / DOT_WAVELEN);
    wctx.fillStyle   = dim;
    wctx.globalAlpha = 0.5 + swell * 0.4;
    wctx.beginPath();
    wctx.arc(x, mid, R * (0.8 + swell * 0.4), 0, Math.PI * 2);
    wctx.fill();

    // Then the bar over it, once it is actually taller than the dot it would
    // otherwise hide inside itself.
    const len = amp * (mid - R);
    if (len > R) {
      wctx.strokeStyle = fg;
      wctx.globalAlpha = 0.35 + amp * 0.65;
      wctx.lineWidth   = R * 2;
      wctx.lineCap     = 'round';
      wctx.beginPath();
      wctx.moveTo(x, mid - len);
      wctx.lineTo(x, mid + len);
      wctx.stroke();
    }
  }
  wctx.globalAlpha = 1;
}

// ── composer ──────────────────────────────────────────────────────────
const box = $('#box');
function sync() {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.4) + 'px';
  const typed = !!box.value.trim();
  $('#composer').classList.toggle('typing', typed);
  $('#send').disabled = busy || !typed;
  // Voice is unavailable mid-reply: the session takes one turn at a time, so
  // offering it would only queue behind the answer being written.
  $('#mic').disabled = busy;
  $('#dict').disabled = busy;
}
box.addEventListener('input', sync);
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); }
});
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  const t = box.value.trim();
  if (!t || busy) return;
  box.value = ''; sync();
  sendText(t);
});

// ── voice: audio helpers ──────────────────────────────────────────────
function toB64(f32) {
  const pcm = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const b = new Uint8Array(pcm.buffer);
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(b64) {
  const bin = atob(b64), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(b.buffer), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  return f;
}
function stopAudio() {
  for (const s of sources) { try { s.stop(); } catch (_) {} }
  sources = []; playCursor = 0; speaking = false;
  endHttpSpeech();
}

// The server suppresses its own turn detection while IT is speaking, but a
// typed reply is spoken over HTTP and the socket knows nothing about it. So
// the microphone is gated here instead for the length of that playback —
// otherwise the mic hears Gemma, the VAD calls it a user turn, and she
// answers herself. Whatever leaked in before the gate closed is dropped.
function endHttpSpeech() {
  if (!httpSpeaking) return;
  httpSpeaking = false;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'input_audio_buffer.clear' }));
  }
}
function enqueue(f32) {
  const buf = ctx.createBuffer(1, f32.length, RATE);
  buf.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(outGain);
  const now = ctx.currentTime;
  if (playCursor < now) playCursor = now + 0.06;   // small lead on the first chunk
  src.start(playCursor); playCursor += buf.duration;
  sources.push(src);
  src.onended = () => {
    sources = sources.filter(s => s !== src);
    if (!sources.length) { speaking = false; endHttpSpeech(); }
  };
  speaking = true;
}

// ── voice: session ────────────────────────────────────────────────────
async function openVoice() {
  if (dictOn) dictCancel();   // one microphone at a time
  document.body.classList.add('voice');
  // Talking is the primary act here; the box is the alternative, so it says
  // what it is for rather than repeating the general invitation.
  $('#box').placeholder = 'Type';

  try {
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
  } catch (err) {
    $('#vstate').textContent = 'microphone denied — ' + err.message;
    return;
  }

  ctx = new AudioContext({ sampleRate: RATE });
  await ctx.resume();
  outGain = ctx.createGain();
  outAn = ctx.createAnalyser(); outAn.fftSize = 512;
  inAn  = ctx.createAnalyser(); inAn.fftSize  = 512;
  outGain.connect(outAn).connect(ctx.destination);
  const srcNode = ctx.createMediaStreamSource(mic);
  srcNode.connect(inAn);

  // Batched in the worklet: at 128 frames a callback this would otherwise be
  // ~190 postMessages a second for no benefit.
  const code = `class Cap extends AudioWorkletProcessor {
    constructor(){ super(); this.b = new Float32Array(${CHUNK}); this.n = 0; }
    process(i){ const c = i[0][0]; if(!c) return true;
      for (let k=0;k<c.length;k++){ this.b[this.n++]=c[k];
        if(this.n===${CHUNK}){ this.port.postMessage(this.b.slice()); this.n=0; } }
      return true; } }
    registerProcessor('cap', Cap);`;
  const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  const node = new AudioWorkletNode(ctx, 'cap');
  srcNode.connect(node);
  node.port.onmessage = e => onChunk(e.data);

  voiceOn = true; muted = false;
  $('#mute').classList.remove('off');
  connectWs();
}

function onChunk(f32) {
  if (!ws || ws.readyState !== 1 || muted) return;
  // Client-side barge-in: the server only runs turn detection when no
  // response is in flight, so cutting a reply short is the client's job.
  if (speaking) {
    let sum = 0;
    for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    if (Math.sqrt(sum / f32.length) > BARGE_RMS) {
      if (++loudRun >= BARGE_HOLD) {
        // A typed reply is spoken over HTTP, not the socket, so there is no
        // response for the socket to cancel — asking anyway earns a spurious
        // "no active response" error. Stopping playback is the part that
        // matters either way.
        if (wsResponding) ws.send(JSON.stringify({ type: 'response.cancel' }));
        stopAudio(); loudRun = 0; endVoiceReply(true);
      }
    } else loudRun = 0;
  }
  // Barge-in above still reads these chunks; they just must not reach the
  // server's turn detector while it would be hearing Gemma, not you.
  if (httpSpeaking) return;
  turnAudio.push(f32.slice());
  ws.send(JSON.stringify({ type: 'input_audio_buffer.append', audio: toB64(f32) }));
}

// A spoken reply is written into the same thread the typed ones are in, as
// it arrives rather than at the end. One model context means one
// conversation; streaming it means a reply cut short is already saved
// instead of living in a buffer that gets discarded.
function endVoiceReply(interrupted) {
  if (!liveBot) return;
  const body = liveBot.querySelector('.body');
  body.classList.remove('cursor');
  if (!body.textContent.trim()) liveBot.remove();        // nothing was ever said
  else if (interrupted) body.textContent += ' …';
  liveBot = null;
  refreshBlank();
}

// Show the user's spoken turn. The row goes in now — before the reply's row,
// which response.created adds next — and its text is filled in later.
async function showSpokenTurn() {
  const chunks = turnAudio;
  turnAudio = [];
  if (!chunks.length) return;

  const row = addMsg('user', '');
  const body = row.querySelector('.body');
  body.classList.add('pending');

  let n = 0;
  for (const c of chunks) n += c.length;
  const all = new Float32Array(n);
  let at = 0;
  for (const c of chunks) { all.set(c, at); at += c.length; }

  try {
    const res = await fetch('/api/transcribe', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ audio: toB64(all), rate: RATE })
    });
    const j = await res.json();
    const text = (j.text || '').trim();
    if (text) { body.textContent = text; }
    else      { row.remove(); }            // nothing intelligible: no empty bubble
  } catch (_) {
    row.remove();                          // dictation unavailable — say nothing
  } finally {
    refreshBlank();
    body.classList.remove('pending');
    scroll();
  }
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/v1/realtime');
  ws.onopen  = () => { $('#vstate').textContent = ''; };   // clears a previous failure
  ws.onerror = () => { $('#vstate').textContent = 'connection failed'; };
  ws.onclose = () => { wsResponding = false; stopAudio(); if (voiceOn) $('#vstate').textContent = 'disconnected'; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    switch (m.type) {
      // Deliberately NOT sharing a body with speech_stopped. These two once
      // both did nothing and were folded together; when the turn handling
      // was added to what looked like the stopped case, started inherited
      // it — and since started fires about 800ms into an utterance, it took
      // the opening words away into their own bubble and left the rest to
      // arrive without them.
      case 'input_audio_buffer.speech_started':
        break;                             // the ribbon already shows this
      case 'input_audio_buffer.speech_stopped':
        turnMark('start');                 // the user is waiting from here
        showSpokenTurn();
        break;
      case 'response.created':
        wsResponding = true;
        if (!turnT0) turnMark('start');    // manual turn_detection: no speech_stopped
        liveBot = addMsg('bot', '');
        liveBot.querySelector('.body').classList.add('cursor');
        break;
      case 'response.output_audio_transcript.delta':
        turnMark('tok');
        if (liveBot) liveBot.querySelector('.body').textContent += m.delta;
        break;
      case 'response.output_audio.delta':
        turnMark('audio');
        enqueue(fromB64(m.delta)); break;
      case 'response.done':
        wsResponding = false;
        turnReport('voice');
        endVoiceReply(false);
        break;
      case 'error':
        // Empty-buffer errors are routine chatter in a quiet room.
        if (m.error && m.error.code !== 'input_audio_buffer_commit_empty') {
          $('#vstate').textContent = m.error.message || m.error.code;
        }
        break;
    }
  };
}

function closeVoice() {
  voiceOn = false;
  turnAudio = [];
  endVoiceReply(true);
  if (ws) ws.close();
  stopAudio();
  if (mic) mic.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  ctx = null; inAn = outAn = null;
  document.body.classList.remove('voice');
  $('#box').placeholder = 'Ask anything';
  refreshBlank();
}

$('#mic').onclick  = () => voiceOn ? closeVoice() : openVoice();
$('#dict').onclick   = dictStart;
$('#cancel').onclick = dictCancel;
$('#accept').onclick = dictAccept;
$('#hang').onclick = closeVoice;
// The button turning red is the feedback; a caption saying so as well is
// one more thing to read.
$('#mute').onclick = () => { muted = !muted; $('#mute').classList.toggle('off', muted); };
addEventListener('keydown', e => { if (e.key === 'Escape' && voiceOn) closeVoice(); });

// ── the voice ribbon ──────────────────────────────────────────────────
//
// Bars were the obvious visual and the wrong one: discrete, quantised, and
// they snap. Speech does not. This draws each side as a few overlapping
// travelling waves instead — continuous curves whose amplitude follows the
// audio, tapered to nothing at the edges so the shape is a lens rather than
// a band with cut ends.
//
// Blue is the microphone, amber is Gemma, both drawn every frame and
// translucent, so where they coincide the colours actually mix instead of
// one hiding the other. Layers within a side run at slightly different
// speeds and wavelengths; that slow drift in and out of phase is what stops
// it looking like a rendered sine and starts it looking alive.
const cv = $('#viz'), g = cv.getContext('2d');
let phase = 0;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Per-side smoothed energy. Rising fast and falling slow is what reads as a
// voice; chasing the raw FFT reads as noise.
let ampIn = 0, ampOut = 0;

function energy(an) {
  if (!an) return 0;
  const d = new Uint8Array(an.frequencyBinCount);
  an.getByteFrequencyData(d);
  let sum = 0;
  const n = Math.min(48, d.length);            // voice lives low in the band
  for (let i = 1; i < n; i++) sum += d[i];
  return (sum / (n - 1)) / 255;
}

// Three layers, each a travelling wave at its own wavelength and speed.
const LAYERS = [
  { k: 1.6, v: 0.55, a: 1.00, alpha: 0.30 },
  { k: 2.7, v: -0.38, a: 0.62, alpha: 0.26 },
  { k: 4.3, v: 0.83, a: 0.38, alpha: 0.20 },
];

function ribbon(colour, amp, w, h, seed) {
  const mid = h / 2;
  const max = h * 0.42;
  for (const L of LAYERS) {
    g.beginPath();
    const steps = 96;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = t * w;
      // Taper to nothing at both ends, so the ribbon has no cut edges.
      const env = Math.sin(Math.PI * t);
      // A slow secondary swell along the length keeps the envelope from
      // being a perfect lens every frame.
      const swell = 0.75 + 0.25 * Math.sin(phase * 0.6 + t * 2.1 + seed);
      const y = mid + Math.sin(t * Math.PI * 2 * L.k + phase * L.v * 3 + seed)
                      * env * swell * max * L.a * amp;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    // Mirror back along the centre to close the shape into a lens.
    for (let i = steps; i >= 0; i--) {
      const t = i / steps;
      const x = t * w;
      const env = Math.sin(Math.PI * t);
      const swell = 0.75 + 0.25 * Math.sin(phase * 0.6 + t * 2.1 + seed);
      const y = mid - Math.sin(t * Math.PI * 2 * L.k + phase * L.v * 3 + seed)
                      * env * swell * max * L.a * amp;
      g.lineTo(x, y);
    }
    g.closePath();
    g.fillStyle = colour;
    g.globalAlpha = L.alpha;
    g.fill();
  }
  g.globalAlpha = 1;
}

function draw() {
  requestAnimationFrame(draw);
  if (!document.body.classList.contains('voice')) return;

  const dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  phase += 0.02;

  const eIn  = muted    ? 0 : energy(inAn);
  const eOut = speaking ? energy(outAn) : 0;
  ampIn  = eIn  > ampIn  ? eIn  : ampIn  * 0.88 + eIn  * 0.12;
  ampOut = eOut > ampOut ? eOut : ampOut * 0.88 + eOut * 0.12;

  // A resting swell so a quiet session breathes rather than going flat.
  const IDLE = 0.06;
  ribbon(css('--speak'),  Math.max(IDLE, ampOut), w, h, 0.0);
  ribbon(css('--listen'), Math.max(IDLE, ampIn),  w, h, 1.7);
}

// Swap in the Google Symbols glyphs only once the font has really loaded.
if (document.fonts && document.fonts.load) {
  document.fonts.load('20px "Google Symbols"').then(() => {
    if (document.fonts.check('20px "Google Symbols"')) document.body.classList.add('gsym');
  }).catch(() => {});
}

// Greeting by local time. Three bands, not four: "good night" is a
// farewell in English, so using it to greet someone who just arrived reads
// as being shown the door. Late hours get "evening" instead.
(() => {
  const h = new Date().getHours();
  const part = h < 5 ? 'evening'
             : h < 12 ? 'morning'
             : h < 18 ? 'afternoon'
             : 'evening';
  $('#greet').textContent = `Good ${part}, Human`;
})();

refreshBlank();
draw();
sync();
</script>
